description: >-
  PickTrace is an agricultural workforce and harvest management SaaS platform
  for large-scale farms, founded by brothers Austin and Harrison Steed and a
  Y Combinator (Summer 2015) alumnus headquartered in Glendale, California. The
  platform captures time-and-attendance, piecework, productivity, onboarding,
  payroll, and receiving data in the field, office, and packinghouse, giving
  growers real-time visibility across their entire workforce year-round. It is
  used daily by tens of thousands of farm workers at some of the largest berry,
  citrus, and apple growers in the United States, Mexico, Peru, Chile, and
  Australia. PickTrace exposes a RESTful API that lets customers and third-party
  developers create, update, and extract objects from all PickTrace tools and
  bi-directionally sync labor data into and out of the platform for automation,
  payroll efficiency, and audit-ready compliance.
